{% raw %}
<template id="login">
<div class="container min-vh-100">
        <div class = "row">
        <div class = "col-12 mb-5 mt-5">
           <h3> Please enter your username and password to login. </h3>
        </div>
        <div class = "col-6">
            <form @submit.prevent="login">
                <div class = "row mb-3">
                       <div class = "col-8">
                        <label> Username </label>
                        <input type = "text" class = "form-control" placeholder="username" maxlength="80" v-model.trim="form.username" required>
                    </div>
                </div>
                <div class = "row mb-3">
                    <div class = "col-8">
                        <label> Password </label>
                        <input type = "password" class = "form-control" placeholder="Password" v-model="form.password" required>
                    </div>
                </div>
                <div class = "row mb-3">
                    <div class = "col">
                        <button type = "submit" class="btn btn-primary">Login</button>
                      </div>
                   </div>
            </form>
        </div>
       </div>
</div>
</template>
{% endraw %}
