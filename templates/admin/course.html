{% raw %}
<template id="admin-course">
<div class="container-fluid mt-4 mb-4">
    <h2>Course Management</h2>
   <form @submit.prevent="load" class="d-flex">
         <div class = "col-6 me-2">
               <input type ="text" v-model.trim="query" class="form-control" placeholder="Search for courses by code, name and course id.">
        </div>
        <div class = "col-3 me-2">
            <button type="submit" class="btn btn-primary">Search</button>
            <button type="button" class="btn btn-primary ms-1" @click="query = ''; load()">Reset</button>
           </div>
    </form>
</div>

<h3 class = "mb-4 mt-4">{{ editingId ? 'Edit Course' : 'Add Course' }}</h3>
<form @submit.prevent="save">
    <div class = "row mb-3">
       <div class = "col">
            <label> Course Code </label>
             <input type = "text" class = "form-control" placeholder="CS101" maxlength="30" v-model.trim="form.course_code" required>
        </div>
        <div class = "col">
              <label> Course Name </label>
            <input type = "text" class = "form-control" placeholder="Programming in Python" maxlength="100" v-model.trim="form.course_name" required>
        </div>
        <div class = "col">
            <label> Status </label>
            <select class = "form-select" v-model="form.status">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
               </select>
        </div>
  </div>
     <div class = "row mb-3">
        <div class = "col">
            <label> Description </label>
          <textarea class = "form-control" rows="2" maxlength="500" v-model.trim="form.description" required></textarea>
        </div>
  </div>
    <div class="row mb-3">
        <div class = "col">
            <button type = "submit" class="btn btn-primary">{{ editingId ? 'Save Changes' : 'Add Course' }}</button>
            <button v-if="editingId" type = "button" class="btn btn-secondary ms-1" @click="resetForm">Cancel</button>
        </div>
    </div>
</form>

<h3 class = "text-center mb-4 mt-4">All Courses</h3>
<div class = "container bg-light mb-5 table-box">
    <table v-if="courses.length" class = "table-striped table-bordered">
      <thead>
        <tr>
        <th class="px-3 py-2">ID</th>
        <th class="px-3 py-2">Code</th>
        <th class="px-3 py-2">Name</th>
        <th class="px-3 py-2">Description</th>
        <th class="px-3 py-2">Status</th>
        <th class="px-3 py-2">Examinations</th>
        <th class="px-3 py-2">Actions</th>
       </tr>
          </thead>
        <tbody>
      <tr v-for="course in courses" :key="course.id">
            <td class="px-3 py-2">{{ course.id }}</td>
	        <td class="px-3 py-2">{{ course.course_code }}</td>
            <td class="px-3 py-2">{{ course.course_name }}</td>
            <td class="px-3 py-2">{{ course.description }}</td>
            <td class="px-3 py-2">{{ label(course.status) }}</td>
            <td class="px-3 py-2">{{ course.total_examinations }}</td>
            <td class="px-2 py-2 text-nowrap">
                <button class="btn btn-primary btn-sm me-1" @click="edit(course)">Edit</button>
                	<button class="btn btn-danger btn-sm" @click="remove(course)">Delete</button>
            </td>
        </tr>
        </tbody>
    </table>
    <div v-else class="row p-4 text-center">
        	<span class= "fs-5">No data to show.</span>
    </div>
</div>
</template>
{% endraw %}
