{% raw %}
<template id="examiner-dashboard">
<div class="container-fluid mt-1">
    	<div class="row min-vh-100">
          <div class="col-md-3 bg-dark text-light p-3">
            <h3>Examiner Menu</h3>
            	<ul class="nav flex-column">
                	<li v-for="item in menu" class="nav-item">
                      <a class="nav-link text-light" :class="{ 'fw-bold': page === item.page }" href="#" @click.prevent="open(item.page)">{{ item.name }}</a>
                </li>
             </ul>
        </div>

        <div class="col-md-9 p-4">

            <div v-if="page === 'dashboard'" class = "container">
                <div class = "row">

                    <div class="card shadow-sm mb-4 bg-info">
                        <div class="card-body">
                            <h5 class="card-title">Name</h5>
                              <p class="card-text">{{stats.my_name}}</p>
                         </div>

                       <div class="card-body">
                            <h5 class="card-title">Department</h5>
                              <p class="card-text">{{stats.my_department}}</p>
                        </div>

                    </div>

                    <div class="card shadow-sm mb-4 bg-info">
                        <div class="card-body">
                            <h5 class="card-title">Assigned Examinations</h5>
                            <p class="card-text">{{stats.assigned_examinations}}</p>
                        </div>

                          <div class="card-body">
                            <h5 class="card-title">Created Examination Slots</h5>
                              <p class="card-text">{{stats.created_slots}}</p>
                        </div>

                      </div>

                    <div class="card shadow-sm mb-4 bg-warning">
                        <div class="card-body">
                            <h5 class="card-title">Booked Students</h5>
                             <p class="card-text">{{stats.booked_students}}</p>
                        </div>

                       <div class="card-body">
		                    <h5 class="card-title">Pending Evaluations</h5>
                            <p class="card-text">{{stats.pending_evaluations}}</p>
                        </div>

                    </div>

                </div>

                <h3 class = "text-center mb-4 mt-4">Assigned Examinations</h3>
                <div class = "container bg-light mb-5 table-box">
                  <table v-if="examinations.length" class = "table-striped table-bordered">
                        <thead>
					    <tr>
                        <th class="px-3 py-2">Examination</th>
                        <th class="px-3 py-2">Type</th>
                        <th class="px-3 py-2">Slot Creation</th>
                        <th class="px-3 py-2">Status</th>
                        </tr>
                        </thead>
                        <tbody>
	                    <tr v-for="exam in examinations" :key="exam.id">
                            <td class="px-3 py-2">{{ exam.examination_name }} ({{ exam.course_code }})</td>
                            <td class="px-3 py-2">{{ label(exam.examination_type) }}</td>
                            <td class="px-3 py-2">{{ dt(exam.slot_creation_start) }} to {{ dt(exam.slot_creation_end) }}</td>
                           <td class="px-3 py-2">{{ label(exam.status) }}</td>
			            </tr>
                        </tbody>
	                </table>
                    <div v-else class="row p-4 text-center">
                        <span class= "fs-5">No examinations assigned yet.</span>
                    </div>
                </div>
            </div>

	        <examiner-examination v-else-if="page === 'examination'"></examiner-examination>
           <examiner-slot v-else-if="page === 'slot'"></examiner-slot>
            <examiner-evaluation v-else-if="page === 'evaluation'"></examiner-evaluation>

        </div>
    </div>
</div>
</template>
{% endraw %}
