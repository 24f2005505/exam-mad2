{% raw %}
<template id="examiner-evaluation">
<div class="container-fluid mt-4 mb-4">
    <h2>Evaluations</h2>
    <p class="text-muted">You can evaluate only the students booked into your slots. Total marks = sum of (marks x weightage).</p>
</div>

<!-- evaluate one student with the rubric -->
<div v-if="booking" class="card shadow-sm mb-4 border-primary">
    <div class="card-header d-flex justify-content-between">
        <b>Evaluate {{ booking.student_name }} - {{ booking.examination_name }} ({{ booking.date }} {{ booking.start_time }})</b>
        <button class="btn btn-secondary btn-sm" @click="booking = null">Close</button>
    </div>
    <div class="card-body">
      <p v-if="!rubrics.length" class="text-danger">Admin has not added a rubric for this examination yet.</p>
        <form v-else @submit.prevent="submit">
             <div v-for="rubric in rubrics" :key="rubric.id" class="row mb-3 align-items-center">
                <div class="col-md-6">
                    <b>{{ rubric.criterion_name }}</b> (max {{ rubric.maximum_marks }}, weightage {{ rubric.weightage }})
                    <div class="small text-muted">{{ rubric.description }}</div>
		        </div>
                <div class="col-md-3">
                    <input type="number" class="form-control" min="0" :max="rubric.maximum_marks" step="0.5" v-model="scores[rubric.id]" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label> Remarks </label>
                    <textarea class="form-control" rows="2" maxlength="500" v-model.trim="remarks"></textarea>
                </div>
             </div>
            <p><b>Total marks: {{ total }} / {{ booking.maximum_marks }}</b></p>
            <button type="submit" class="btn btn-primary">Submit Evaluation</button>
       </form>
    </div>
</div>

<h3 class = "text-center mb-4 mt-4">Pending Evaluations</h3>
<div class = "container bg-light mb-5 table-box">
    <table v-if="pending.length" class = "table-striped table-bordered">
	    <thead>
        <tr>
        <th class="px-3 py-2">Student</th>
         <th class="px-3 py-2">Examination</th>
        <th class="px-3 py-2">Slot</th>
	    <th class="px-3 py-2">Action</th>
           </tr>
          </thead>
        <tbody>
        <tr v-for="item in pending" :key="item.id">
            <td class="px-3 py-2">{{ item.student_name }}</td>
          <td class="px-3 py-2">{{ item.examination_name }} ({{ item.course_code }})</td>
               <td class="px-3 py-2">{{ item.date }} {{ item.start_time }}-{{ item.end_time }}</td>
            <td class="px-2 py-2"><button class="btn btn-primary btn-sm" @click="open(item)">Evaluate</button></td>
        </tr>
        </tbody>
    </table>
	<div v-else class="row p-4 text-center">
        <span class= "fs-5">No pending evaluations.</span>
    </div>
</div>

<h3 class = "text-center mb-4 mt-4">Evaluated</h3>
<div class = "container bg-light mb-5 table-box">
    <table v-if="done.length" class = "table-striped table-bordered">
        <thead>
        <tr>
        <th class="px-3 py-2">Student</th>
       <th class="px-3 py-2">Examination</th>
        <th class="px-3 py-2">Slot</th>
        <th class="px-3 py-2">Marks</th>
        <th class="px-3 py-2">Remarks</th>
        <th class="px-3 py-2">Action</th>
        </tr>
          </thead>
        <tbody>
        <tr v-for="item in done" :key="item.id">
            <td class="px-3 py-2">{{ item.student_name }}</td>
            <td class="px-3 py-2">{{ item.examination_name }} ({{ item.course_code }})</td>
            <td class="px-3 py-2">{{ item.date }} {{ item.start_time }}-{{ item.end_time }}</td>
             <td class="px-3 py-2">{{ item.evaluation.total_marks }} / {{ item.maximum_marks }}</td>
              <td class="px-3 py-2">{{ item.evaluation.remarks }}</td>
		    <td class="px-2 py-2"><button class="btn btn-primary btn-sm" @click="open(item)">Edit</button></td>
	    </tr>
		</tbody>
    </table>
    <div v-else class="row p-4 text-center">
        <span class= "fs-5">No evaluations yet.</span>
       </div>
</div>
</template>
{% endraw %}
