{% raw %}
<template id="examiner-slot">
<div class="container-fluid mt-4 mb-4">
       <h2>My Slots</h2>
    <p class="text-muted">Slots can be updated or removed only before student booking begins.</p>
</div>

<!-- edit one slot -->
<div v-if="editingSlot" class="card shadow-sm mb-4 border-primary">
    <div class="card-header"><b>Edit slot of {{ editingSlot.examination_name }}</b></div>
    <div class="card-body">
	    <form @submit.prevent="save">
		    <div class = "row mb-3">
              <div class = "col-md">
                    <label> Date </label>
                    <input type = "date" class = "form-control" v-model="form.date" required>
                </div>
                 <div class = "col-md">
	                <label> Start Time </label>
                    <input type = "time" class = "form-control" v-model="form.start_time" required>
				</div>
                <div class = "col-md">
                    <label> End Time </label>
                    <input type = "time" class = "form-control" v-model="form.end_time" required>
                </div>
          </div>
            	<div class = "row mb-3">
                <div class = "col-md">
                    <label> Maximum Student Capacity </label>
                    <input type = "number" min="1" class = "form-control" v-model="form.max_student_capacity" required>
                </div>
                <div class = "col-md">
                    <label> Meeting Link (optional) </label>
                    <input type = "url" class = "form-control" v-model.trim="form.meeting_link">
                </div>
            </div>
           <button type = "submit" class="btn btn-primary btn-sm">Save</button>
            <button type = "button" class="btn btn-secondary btn-sm ms-1" @click="editingSlot = null">Cancel</button>
        </form>
    </div>
</div>

<!-- students booked in one slot -->
<div v-if="studentsSlot" class="card shadow-sm mb-4 border-info">
   <div class="card-header d-flex justify-content-between">
       <b>Students in {{ studentsSlot.examination_name }} on {{ studentsSlot.date }} {{ studentsSlot.start_time }}</b>
        	<button class="btn btn-secondary btn-sm" @click="studentsSlot = null">Close</button>
    </div>
    	<div class="card-body">
        <table v-if="students.length" class = "table-striped table-bordered w-100">
			<thead>
		    <tr>
            <th class="px-3 py-2">Student</th>
               <th class="px-3 py-2">Email</th>
			<th class="px-3 py-2">Status</th>
            <th class="px-3 py-2">Marks</th>
            </tr>
	        </thead>
            	<tbody>
            <tr v-for="booking in students" :key="booking.id">
                <td class="px-3 py-2">{{ booking.student_name }}</td>
				<td class="px-3 py-2">{{ booking.student_email }}</td>
                <td class="px-3 py-2">{{ label(booking.status) }}</td>
                	<td class="px-3 py-2">{{ booking.evaluation ? booking.evaluation.total_marks + ' / ' + booking.maximum_marks : 'Not evaluated' }}</td>
		    </tr>
           </tbody>
		</table>
        <p v-else>No students have booked this slot.</p>
    </div>
</div>

<div class = "container bg-light mb-5 table-box">
    <table v-if="slots.length" class = "table-striped table-bordered">
        <thead>
        <tr>
        <th class="px-3 py-2">Examination</th>
        <th class="px-3 py-2">Date</th>
		<th class="px-3 py-2">Time</th>
        <th class="px-3 py-2">Booked / Capacity</th>
        <th class="px-3 py-2">Status</th>
        <th class="px-3 py-2">Meeting Link</th>
        <th class="px-3 py-2">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr v-for="slot in slots" :key="slot.id">
          <td class="px-3 py-2">{{ slot.examination_name }} ({{ slot.course_code }})</td>
			<td class="px-3 py-2">{{ slot.date }}</td>
            <td class="px-3 py-2">{{ slot.start_time }} - {{ slot.end_time }}</td>
           <td class="px-3 py-2">{{ slot.booked_students }} / {{ slot.max_student_capacity }}</td>
            <td class="px-3 py-2">{{ label(slot.status) }}</td>
            <td class="px-3 py-2"><a v-if="slot.meeting_link" :href="slot.meeting_link" target="_blank">Link</a></td>
            <td class="px-2 py-2">
                <button class="btn btn-primary btn-sm me-1 mb-1" @click="showStudents(slot)">Students</button>
                   <template v-if="slot.can_change">
                   <button class="btn btn-primary btn-sm me-1 mb-1" @click="edit(slot)">Edit</button>
					<button class="btn btn-danger btn-sm me-1 mb-1" @click="remove(slot)">Remove</button>
                   </template>
              <button v-if="slot.status === 'available' || slot.status === 'full'" class="btn btn-success btn-sm mb-1" @click="complete(slot)">Mark Completed</button>
              </td>
       </tr>
        </tbody>
    </table>
    <div v-else class="row p-4 text-center">
        <span class= "fs-5">No slots yet. Create them from My Examinations.</span>
    </div>
</div>
</template>
{% endraw %}
